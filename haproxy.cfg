global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# ----------------------------------------------------------------------
# FRONTEND: Intercept ONLY HTTPS traffic (port 443).
# Routes by SNI: swampyankeetech.com -> tls_reverse_proxy
#                 darkroomfinder.org  -> df_reverse_proxy
# ----------------------------------------------------------------------
frontend https_in
    bind *:443
    mode tcp

    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    acl is_swampyankeetech req_ssl_sni -i swampyankeetech.com www.swampyankeetech.com
    acl is_darkroomfinder req_ssl_sni -i darkroomfinder.org www.darkroomfinder.org

    use_backend tls_reverse_proxy if is_swampyankeetech
    use_backend df_reverse_proxy if is_darkroomfinder

    default_backend tls_reverse_proxy

# ----------------------------------------------------------------------
# BACKENDS: Forward raw encrypted TCP traffic
# ----------------------------------------------------------------------
backend tls_reverse_proxy
    mode tcp
    # Direct TCP passthrough (no PROXY protocol) with robust health checks
    server tls_rproxy 127.0.0.1:8443 check inter 2000ms fall 3 rise 2

backend df_reverse_proxy
    mode tcp
    # Direct TCP passthrough (no PROXY protocol) with robust health checks
    server df_rproxy 127.0.0.1:8444 check inter 2000ms fall 3 rise 2

